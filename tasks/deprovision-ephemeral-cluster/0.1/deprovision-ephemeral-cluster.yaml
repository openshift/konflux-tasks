apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deprovision-ephemeral-cluster
spec:
  description: >-
    Deprovision an ephemeral cluster within the Test Platform (OpenShift CI) infrastructure.
  params:
  - name: testPlatformClusterClaimName
    type: string
    description: >-
      Name of the TestPlatformCluster Claim that was used to request an ephemeral cluster
  - name: testPlatformClusterClaimNamespace
    type: string
    description: >-
      Namespace of the TestPlatformCluster Claim that was used to request an ephemeral cluster
  - name: timeout
    type: string
    default: 2h
    description: "Wait for the ephemeral cluster to be deprovisioned until this timeout is reached"
  steps:
  - name: deprovision-ephemeral-cluster
    image: quay.io/konflux-ci/konflux-test:v1.4.52@sha256:aa2c97da9bb73a4e8d1c6b41950f8d902b74461be0e042debe89277fdc4ebe49
    env:
    - name: CLAIM_NAME
      value: $(params.testPlatformClusterClaimName)
    - name: NAMESPACE
      value: $(params.testPlatformClusterClaimNamespace)
    - name: CLUSTER_DEPROVISIONING_TIMEOUT
      value: $(params.timeout)
    script: |
      #!/bin/bash
      set -eo pipefail

      DEPROVISION_SUCCESS=0

      on_exit() {
          if [ "$DEPROVISION_SUCCESS" -eq 0 ]; then
              echo "Dumping TestPlatformCluster claim status for debugging:"
              oc -n "$NAMESPACE" get testplatformclusters.ci.openshift.org "$CLAIM_NAME" -o yaml
          fi
      }
      trap on_exit EXIT

      echo "Deprovisioning cluster: $CLAIM_NAME (namespace: $NAMESPACE)"

      cat >deprovision-patch.json <<EOF
      [{
          "op": "add",
          "path": "/spec/tearDownCluster",
          "value": true
      }]
      EOF

      echo "Patching TestPlatformCluster claim to trigger teardown..."
      oc -n "$NAMESPACE" patch testplatformclusters.ci.openshift.org "$CLAIM_NAME" --type=json --patch-file=deprovision-patch.json

      echo "Waiting for deprovisioning to complete (timeout: $CLUSTER_DEPROVISIONING_TIMEOUT)..."
      oc -n "$NAMESPACE" wait testplatformclusters.ci.openshift.org "$CLAIM_NAME" --for=condition=ProwJobCompleted=true --timeout="$CLUSTER_DEPROVISIONING_TIMEOUT"

      if ec=$(oc -n "$NAMESPACE" get testplatformclusters.ci.openshift.org "$CLAIM_NAME" -o json 2>&1); then
        deprovision_succeeded=$(jq -r 'any((.status.conditions // [])[]; .type == "_EphemeralClusterPhase" and .message == "Deprovisioned")' <<<"$ec")
        if [ "$deprovision_succeeded" == "true" ]; then
          DEPROVISION_SUCCESS=1
          echo 'The cluster has been properly deprovisioned'
        else
          echo "Error: failed to deprovision the cluster"
          echo "$ec"
          exit 1
        fi
      else
        echo "Error: failed to get TestPlatformCluster '$CLAIM_NAME'"
        echo "$ec"
        exit 1
      fi
